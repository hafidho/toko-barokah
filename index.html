<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toko Jus Capung Durian</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #fff8dc;
            text-align: center;
        }

        header {
            background: #4caf50;
            color: white;
            padding: 25px;
        }

        nav {
            background: #333;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        h2 {
            color: #388e3c;
        }

        .produk {
            display: inline-block;
            width: 250px;
            background: white;
            margin: 15px;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 0 10px gray;
        }

        .produk img {
            width: 100%;
            height: 170px;
            object-fit: cover;
            border-radius: 10px;
        }

        .harga {
            color: #e65100;
            font-weight: bold;
        }

        button {
            background: #4caf50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        footer {
            background: #333;
            color: white;
            padding: 15px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <header>
        <h1>🍹 TOKO JUS CAPUNG DURIAN 🌳</h1>
        <p>Segar, Unik, dan Terjangkau!</p>
    </header>

    <nav>
        <a href="#menu">Menu</a>
        <a href="#kontak">Kontak</a>
    </nav>

    <h2 id="menu">DAFTAR MENU</h2>

    <!-- MENU JUS -->
    <div class="produk">
        <img src="https://loremflickr.com/600/400/juice" alt="Jus">
        <h3>🍹 1. JUS</h3>
        <p>Jus buah segar dan nikmat.</p>
        <p class="harga">Rp10.000</p>
        <button>Pesan</button>
    </div>

    <!-- MENU CAPUNG -->
    <div class="produk">
        <img src="https://loremflickr.com/600/400/dragonfly" alt="Capung">
        <h3>🪰 2. CAPUNG</h3>
        <p>Menu Capung spesial.</p>
        <p class="harga">Rp5.000</p>
        <button>Pesan</button>
    </div>

    <!-- MENU DURIAN -->
    <div class="produk">
        <img src="https://loremflickr.com/600/400/durian" alt="Durian">
        <h3>🌳 3. DURIAN</h3>
        <p>Durian pilihan yang lezat.</p>
        <p class="harga">Rp25.000</p>
        <button>Pesan</button>
    </div>

    <div id="kontak">
        <h2>📞 Kontak</h2>
        <p>WhatsApp: 085733835336</p>
    </div>

    <footer>
        <p>© 2026 Toko barokah</p>
    </footer>

</body>
</html>
